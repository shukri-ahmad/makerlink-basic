<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakerLink IDE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { gray: { 850: '#1f2937', 900: '#111827' } } } }
        }
    </script>
    <style>
        body { background-color: #111827; color: #e5e7eb; font-family: 'Segoe UI', system-ui, sans-serif; }
        .editable { transition: all 0.2s; border-radius: 4px; padding: 2px 4px; border: 1px solid transparent; }
        .edit-mode .editable { border-color: #4b5563; background-color: #374151; cursor: text; outline: none; }
        .edit-mode .editable:focus { border-color: #3b82f6; background-color: #1f2937; }
        
        /* Toggle Switch CSS */
        .toggle-checkbox:checked { right: 0; border-color: #10B981; }
        .toggle-checkbox:checked + .toggle-label { background-color: #10B981; }
        .toggle-checkbox { right: 0; z-index: 1; border-color: #e5e7eb; transition: all 0.3s; }
        .toggle-label { width: 3rem; height: 1.5rem; background-color: #4B5563; transition: all 0.3s; }
        
        /* Hide public toggles when not editing */
        .public-toggle { display: none; }
        .edit-mode .public-toggle { display: flex; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">MakerLink IDE</h1>
            <button id="btnConnect" onclick="connectBluetooth()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg shadow transition">
                🔌 Connect to micro:bit
            </button>
        </div>
        
        <div class="flex items-center gap-4">
            <button id="btnLock" onclick="toggleEditMode()" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg border border-gray-600 shadow transition flex items-center gap-2">
                <span>🔒</span> <span id="lockText">Run Mode</span>
            </button>
            <button id="btnCloud" onclick="toggleCloud()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-4 rounded-lg shadow transition flex items-center gap-2">
                <span>☁️</span> Go Public
            </button>
        </div>
    </header>

    <!-- Cloud Sync Payload Area (Hidden by Default) -->
    <div id="cloudArea" class="hidden bg-gray-900 border-b border-gray-700 p-4 shrink-0">
        <div class="flex justify-between items-center mb-2">
            <h3 class="font-bold text-purple-400">Cloud Sync JSON Payload (Live)</h3>
            <span class="text-xs text-gray-400">Enable switches on cards in Edit Mode to include them</span>
        </div>
        <textarea id="cloudPayload" class="w-full h-24 bg-gray-800 text-green-400 font-mono text-sm p-2 rounded border border-gray-700" readonly></textarea>
    </div>

    <!-- Main Content Area -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Tabs -->
        <div class="w-48 bg-gray-800 border-r border-gray-700 flex flex-col p-2 gap-2">
            <button onclick="switchTab('basic')" id="tab-basic" class="tab-btn w-full text-left px-4 py-3 rounded bg-blue-600 text-white font-bold">📡 Basic (Twin)</button>
            <button onclick="switchTab('advanced')" id="tab-advanced" class="tab-btn w-full text-left px-4 py-3 rounded hover:bg-gray-700 text-gray-300 font-bold">⚙️ Advanced (MOTION:BIT)</button>
        </div>

        <!-- Scrollable Viewport -->
        <div class="flex-1 overflow-y-auto p-6 bg-gray-900" id="main-viewport">
            
            <!-- BASIC TAB: micro:bit built-in sensors -->
            <div id="view-basic" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- Temp -->
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg flex flex-col items-center">
                    <span class="text-gray-400 text-sm">Temperature</span>
                    <div class="text-4xl font-bold text-emerald-400 mt-2"><span id="val-temp">--</span>°C</div>
                </div>
                <!-- Light -->
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg flex flex-col items-center">
                    <span class="text-gray-400 text-sm">Light Level</span>
                    <div class="text-4xl font-bold text-yellow-400 mt-2"><span id="val-light">--</span></div>
                </div>
                <!-- Sound -->
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg flex flex-col items-center">
                    <span class="text-gray-400 text-sm">Sound Level</span>
                    <div class="text-4xl font-bold text-blue-400 mt-2"><span id="val-sound">--</span></div>
                </div>
                <!-- Heading -->
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg flex flex-col items-center">
                    <span class="text-gray-400 text-sm">Compass</span>
                    <div class="text-4xl font-bold text-purple-400 mt-2"><span id="val-head">--</span>°</div>
                </div>
                <!-- Pitch & Roll -->
                <div class="col-span-2 bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg flex justify-around">
                    <div class="text-center">
                        <span class="text-gray-400 text-sm">Pitch</span>
                        <div class="text-3xl font-bold text-pink-400 mt-1"><span id="val-pitch">--</span>°</div>
                    </div>
                    <div class="text-center">
                        <span class="text-gray-400 text-sm">Roll</span>
                        <div class="text-3xl font-bold text-cyan-400 mt-1"><span id="val-roll">--</span>°</div>
                    </div>
                </div>
                <!-- Buttons -->
                <div class="col-span-2 bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg flex justify-around items-center">
                    <div class="text-center flex flex-col items-center">
                        <span class="text-gray-400 text-sm mb-2">Button A</span>
                        <div id="val-btnA" class="w-8 h-8 rounded-full bg-gray-600 transition-colors"></div>
                    </div>
                    <div class="text-center flex flex-col items-center">
                        <span class="text-gray-400 text-sm mb-2">Button B</span>
                        <div id="val-btnB" class="w-8 h-8 rounded-full bg-gray-600 transition-colors"></div>
                    </div>
                    <div class="text-center flex flex-col items-center">
                        <span class="text-gray-400 text-sm mb-2">Shake</span>
                        <div id="val-shk" class="w-8 h-8 rounded-full bg-gray-600 transition-colors"></div>
                    </div>
                </div>
            </div>

            <!-- ADVANCED TAB: MOTION:BIT Control -->
            <div id="view-advanced" class="hidden">
                <h2 class="text-xl font-bold text-gray-300 mb-4 border-b border-gray-700 pb-2">Motors & Actuators</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                    <!-- Generate 4 Motor Cards -->
                    <script>
                        for(let i=1; i<=4; i++) {
                            document.write(`
                                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg" id="card-m${i}">
                                    <div class="flex justify-between items-center mb-4">
                                        <h3 class="font-bold text-emerald-400 editable" contenteditable="false" data-key="title-m${i}">DC Motor ${i}</h3>
                                        <div class="public-toggle flex items-center gap-2">
                                            <span class="text-xs text-gray-400">Public</span>
                                            <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                                                <input type="checkbox" id="pub-m${i}" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                                                <label for="pub-m${i}" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-4 mb-4">
                                        <input type="range" min="-255" max="255" value="0" class="w-full accent-emerald-500" oninput="document.getElementById('val-m${i}').innerText=this.value; sendCommand('M${i}:'+this.value);" id="slider-m${i}">
                                        <span id="val-m${i}" class="text-lg font-mono font-bold w-12 text-right">0</span>
                                    </div>
                                    <button onclick="document.getElementById('slider-m${i}').value=0; document.getElementById('val-m${i}').innerText='0'; sendCommand('M${i}:0');" class="w-full bg-red-900/50 hover:bg-red-600 text-red-200 py-1 rounded transition border border-red-800">STOP</button>
                                </div>
                            `);
                        }
                    </script>
                </div>

                <h2 class="text-xl font-bold text-gray-300 mb-4 border-b border-gray-700 pb-2">External Sensors (Telemetry & Charts)</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <!-- Generate 8 Sensor Cards -->
                    <script>
                        for(let i=1; i<=8; i++) {
                            document.write(`
                                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg flex flex-col" id="card-s${i}">
                                    <div class="flex justify-between items-start mb-2">
                                        <h3 class="font-bold text-blue-400 editable" contenteditable="false" data-key="title-s${i}">Sensor ${i}</h3>
                                        <div class="public-toggle flex items-center gap-2">
                                            <input type="checkbox" id="pub-s${i}" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                                            <label for="pub-s${i}" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                                        </div>
                                    </div>
                                    <div class="flex items-baseline gap-1 mt-2">
                                        <span id="val-s${i}" class="text-3xl font-bold text-gray-100 ext-value">0</span>
                                        <span class="text-gray-400 editable ext-unit font-bold text-sm" contenteditable="false" data-key="unit-s${i}">unit</span>
                                    </div>
                                    <div class="w-full h-24 mt-4 bg-gray-900 rounded p-1">
                                        <canvas id="chart-s${i}"></canvas>
                                    </div>
                                </div>
                            `);
                        }
                    </script>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        // --- UI & TAB LOGIC ---
        let isEditMode = false;
        let isCloudActive = false;
        const charts = {}; // Store Chart.js instances

        function switchTab(tabId) {
            document.getElementById('view-basic').classList.add('hidden');
            document.getElementById('view-advanced').classList.add('hidden');
            document.getElementById('tab-basic').classList.replace('bg-blue-600', 'hover:bg-gray-700');
            document.getElementById('tab-basic').classList.replace('text-white', 'text-gray-300');
            document.getElementById('tab-advanced').classList.replace('bg-blue-600', 'hover:bg-gray-700');
            document.getElementById('tab-advanced').classList.replace('text-white', 'text-gray-300');

            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.replace('hover:bg-gray-700', 'bg-blue-600');
            document.getElementById(`tab-${tabId}`).classList.replace('text-gray-300', 'text-white');
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('btnLock');
            const txt = document.getElementById('lockText');
            
            if(isEditMode) {
                document.body.classList.add('edit-mode');
                txt.innerText = "Editing UI";
                btn.classList.replace('bg-gray-700', 'bg-red-600');
                btn.classList.replace('hover:bg-gray-600', 'hover:bg-red-500');
                btn.classList.replace('border-gray-600', 'border-red-500');
                btn.querySelector('span').innerText = "🔓";
                document.querySelectorAll('.editable').forEach(el => el.setAttribute('contenteditable', 'true'));
            } else {
                document.body.classList.remove('edit-mode');
                txt.innerText = "Run Mode";
                btn.classList.replace('bg-red-600', 'bg-gray-700');
                btn.classList.replace('hover:bg-red-500', 'hover:bg-gray-600');
                btn.classList.replace('border-red-500', 'border-gray-600');
                btn.querySelector('span').innerText = "🔒";
                document.querySelectorAll('.editable').forEach(el => el.setAttribute('contenteditable', 'false'));
                saveTitles(); // Save custom labels to localStorage
            }
        }

        function toggleCloud() {
            isCloudActive = !isCloudActive;
            const area = document.getElementById('cloudArea');
            const btn = document.getElementById('btnCloud');
            if(isCloudActive) {
                area.classList.remove('hidden');
                btn.classList.replace('bg-purple-600', 'bg-green-600');
                btn.classList.replace('hover:bg-purple-500', 'hover:bg-green-500');
                btn.innerText = "☁️ Sync Active";
                updateCloudPayload();
            } else {
                area.classList.add('hidden');
                btn.classList.replace('bg-green-600', 'bg-purple-600');
                btn.classList.replace('hover:bg-green-500', 'hover:bg-purple-500');
                btn.innerText = "☁️ Go Public";
            }
        }

        function updateCloudPayload() {
            if(!isCloudActive) return;
            const payload = { timestamp: Date.now(), motors: {}, sensors: {} };
            
            // Scrape Motors
            for(let i=1; i<=4; i++) {
                if(document.getElementById(`pub-m${i}`).checked) {
                    let title = document.querySelector(`[data-key="title-m${i}"]`).innerText;
                    let val = document.getElementById(`slider-m${i}`).value;
                    payload.motors[title] = parseInt(val);
                }
            }
            // Scrape Sensors
            for(let i=1; i<=8; i++) {
                if(document.getElementById(`pub-s${i}`).checked) {
                    let title = document.querySelector(`[data-key="title-s${i}"]`).innerText;
                    let val = document.getElementById(`val-s${i}`).innerText;
                    let unit = document.querySelector(`[data-key="unit-s${i}"]`).innerText;
                    payload.sensors[title] = { value: parseFloat(val) || 0, unit: unit };
                }
            }
            document.getElementById('cloudPayload').value = JSON.stringify(payload, null, 2);
        }

        function saveTitles() {
            document.querySelectorAll('.editable').forEach(el => {
                localStorage.setItem(el.getAttribute('data-key'), el.innerText);
            });
        }

        function loadTitles() {
            document.querySelectorAll('.editable').forEach(el => {
                let saved = localStorage.getItem(el.getAttribute('data-key'));
                if(saved) el.innerText = saved;
            });
        }

        // --- CHART JS SETUP ---
        function initCharts() {
            for(let i=1; i<=8; i++) {
                const ctx = document.getElementById(`chart-s${i}`).getContext('2d');
                charts[`s${i}`] = new Chart(ctx, {
                    type: 'line',
                    data: { labels: [], datasets: [{ data: [], borderColor: '#60A5FA', borderWidth: 2, pointRadius: 0, tension: 0.3 }] },
                    options: { responsive: true, maintainAspectRatio: false, scales: { x: { display: false }, y: { display: true, ticks: { color: '#6B7280', maxTicksLimit: 3 }, grid: { color: '#374151' } } }, plugins: { legend: { display: false } }, animation: false }
                });
            }
        }
        
        function updateChart(id, value) {
            if(!charts[id]) return;
            const chart = charts[id];
            chart.data.labels.push('');
            chart.data.datasets[0].data.push(value);
            if(chart.data.labels.length > 20) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }
            chart.update();
        }

        // --- BLUETOOTH UART LOGIC ---
        let bluetoothDevice;
        let bluetoothServer;
        let uartService;
        let rxCharacteristic; // Channel to Receive data FROM micro:bit
        let txCharacteristic; // Channel to Transmit data TO micro:bit

        async function connectBluetooth() {
            try {
                console.log("Requesting Bluetooth Device...");
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'BBC micro:bit' }],
                    optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e'] 
                });

                console.log("Connecting to GATT Server...");
                bluetoothServer = await bluetoothDevice.gatt.connect();

                console.log("Getting UART Service...");
                uartService = await bluetoothServer.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');

                console.log("Getting TX/RX Characteristics...");
                
                // FIXED: micro:bit transmits on 0002 (Web App listens here)
                rxCharacteristic = await uartService.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
                
                // FIXED: micro:bit receives on 0003 (Web App writes here)
                txCharacteristic = await uartService.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dcca9e');

                // Start listening to the correct channel
                await rxCharacteristic.startNotifications();
                rxCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

                document.getElementById("btnConnect").innerHTML = "✅ Connected";
                document.getElementById("btnConnect").classList.replace("bg-blue-600", "bg-green-600");
                console.log("Bluetooth Connected Successfully!");

            } catch (error) {
                console.error("Bluetooth Connection Error: ", error);
                alert("Bluetooth connection failed. Check browser console.");
            }
        }

        async function sendCommand(cmd) {
            if (!txCharacteristic) return;
            try {
                let encoder = new TextEncoder();
                let data = encoder.encode(cmd + "\n");
                
                if (txCharacteristic.properties.writeWithoutResponse) {
                    await txCharacteristic.writeValueWithoutResponse(data);
                } else {
                    await txCharacteristic.writeValue(data);
                }
            } catch (error) {
                console.error('Send Error:', error);
            }
        }

        // Buffer for incoming serial data
        let incomingBuffer = "";
        function handleIncomingData(event) {
            let decoder = new TextDecoder('utf-8');
            let chunk = decoder.decode(event.target.value);
            incomingBuffer += chunk;
            
            let lines = incomingBuffer.split('\n');
            incomingBuffer = lines.pop(); // keep incomplete line in buffer

            for(let line of lines) {
                parseTelemetry(line.trim());
            }
            if(isCloudActive) updateCloudPayload();
        }

        function parseTelemetry(dataStr) {
            if(!dataStr) return;
            
            // Format example: "temp:25,light:100,pitch:45,s1:400"
            let pairs = dataStr.split(',');
            for(let pair of pairs) {
                let [key, val] = pair.split(':');
                if(!key || val === undefined) continue;
                
                // Basic sensors
                if(document.getElementById(`val-${key}`)) {
                    if(key === 'btnA' || key === 'btnB' || key === 'shk') {
                        document.getElementById(`val-${key}`).classList.replace(
                            val == "1" ? 'bg-gray-600' : 'bg-red-500', 
                            val == "1" ? 'bg-red-500' : 'bg-gray-600'
                        );
                    } else {
                        document.getElementById(`val-${key}`).innerText = val;
                    }
                }
                
                // Advanced external sensors (s1 to s8)
                if(key.match(/^s[1-8]$/)) {
                    if(document.getElementById(`val-${key}`)) {
                        document.getElementById(`val-${key}`).innerText = val;
                        updateChart(key, parseFloat(val));
                    }
                }
            }
        }

        // Initialize App
        window.onload = () => {
            loadTitles();
            initCharts();
        };

    </script>
</body>
</html>
