<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakerLink Basic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .led { 
            width: 100%; 
            aspect-ratio: 1; 
            background-color: #334155; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.1s; 
        }
        .led.active { background-color: #ef4444; box-shadow: 0 0 16px #ef4444; }
        body.is-editing .ui-editable { border-bottom: 1px dashed #facc15; border-radius: 0; transition: border 0.2s; cursor: text !important; }
        body:not(.is-editing) .ui-editable { border-bottom: 1px solid transparent; }
        body:not(.is-editing) .ui-editable-btn { pointer-events: none; }
        #msg-box { transition: opacity 0.3s, transform 0.3s; }
        .btn-press { transform: scale(0.85); background-color: #ef4444 !important; box-shadow: inset 0 4px 10px rgba(0,0,0,0.7) !important; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col p-4 md:p-6 overflow-x-hidden">

    <div id="msg-box" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-xl shadow-2xl z-50 opacity-0 pointer-events-none font-bold text-center border-2 border-red-400">Message</div>

    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 mb-6 gap-4 md:gap-0 shrink-0">
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">MakerLink Basic</h1>
        <div class="flex flex-wrap gap-3 justify-center">
            <button id="btnConnect" onclick="connectBluetooth()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg transition-colors shadow-lg">🔌 Connect</button>
            <button id="btn-edit" onclick="toggleEditMode()" class="bg-slate-600 hover:bg-slate-500 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[140px] shadow-lg">🔒 Lock UI</button>
            <button id="btn-cloud" onclick="toggleCloud()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[140px] shadow-lg">☁️ Go Public</button>
            <button id="btn-sim" onclick="toggleSim()" class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[130px] shadow-lg">🧪 Sim Mode</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1 min-h-0">
        
        <!-- Digital Twin Column -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 flex flex-col items-center justify-center">
            <h2 class="text-xl font-bold mb-6 text-slate-300">Digital Twin</h2>
            <div class="bg-slate-950 p-6 sm:p-10 rounded-[3.5rem] border-b-[12px] border-slate-900 w-full max-w-[420px] lg:max-w-[480px] shadow-2xl relative pt-6 flex flex-col">
                <div class="flex justify-center mb-6 sm:mb-8">
                    <div id="twin-logo" class="w-16 h-8 bg-slate-800 rounded-b-2xl border-b-4 border-yellow-600 flex justify-center items-end pb-1.5 transition-all duration-100"><span class="text-xs font-bold text-yellow-600">LOGO</span></div>
                </div>
                <div class="flex justify-between items-center px-1 sm:px-2 mb-4">
                    <button id="twin-btnA" class="w-14 h-14 sm:w-16 sm:h-16 shrink-0 rounded-full bg-slate-700 flex items-center justify-center text-lg sm:text-xl font-bold shadow-[inset_0_4px_8px_rgba(0,0,0,0.6)] transition-all duration-75">A</button>
                    <!-- Enlarged LED Grid Container and Spacing -->
                    <div class="grid grid-cols-5 gap-3 sm:gap-4 bg-black p-5 sm:p-7 rounded-2xl flex-1 max-w-[260px] sm:max-w-[320px] mx-3 sm:mx-5" id="led-matrix"></div>
                    <button id="twin-btnB" class="w-14 h-14 sm:w-16 sm:h-16 shrink-0 rounded-full bg-slate-700 flex items-center justify-center text-lg sm:text-xl font-bold shadow-[inset_0_4px_8px_rgba(0,0,0,0.6)] transition-all duration-75">B</button>
                </div>
            </div>
            <button onclick="sendBluetoothCommand('ICO:Clear')" class="mt-8 bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 px-8 rounded-full shadow-lg transition-colors border border-slate-600 active:bg-red-500 active:border-red-500 flex items-center gap-2"><span class="text-xl">🧽</span> Clear Screen</button>
        </div>
        
        <!-- Instruments Column -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 flex flex-col gap-6 overflow-y-auto">
            <h2 class="text-xl font-bold text-slate-300">Instruments</h2>
            <div id="shake-indicator" class="bg-slate-700 text-slate-400 text-center py-2 rounded-lg font-bold uppercase transition-colors border border-slate-600">No Shake</div>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-900 p-4 rounded-lg flex flex-col items-center border border-slate-700 shadow-inner">
                    <span class="text-sm font-bold text-slate-400 mb-2">PITCH</span>
                    <div class="h-24 w-12 bg-slate-800 rounded-full relative overflow-hidden flex justify-center border border-slate-700"><div id="pitch-bar" class="w-full h-1 bg-green-500 absolute top-1/2 transition-transform duration-200 shadow-[0_0_8px_#22c55e]"></div></div>
                    <span id="val-pitch" class="mt-2 font-mono text-green-400 font-bold">0°</span>
                </div>
                <div class="bg-slate-900 p-4 rounded-lg flex flex-col items-center border border-slate-700 shadow-inner overflow-hidden">
                    <span class="text-sm font-bold text-slate-400 mb-2">ROLL</span>
                    <div class="h-24 w-24 bg-slate-800 rounded-full relative overflow-hidden flex justify-center items-center border-2 border-slate-700 shadow-inner">
                        <div id="roll-horizon" class="w-[150%] h-[150%] absolute transition-transform duration-200 flex flex-col"><div class="h-1/2 w-full bg-blue-500/30 border-b-2 border-blue-500 shadow-[0_4px_10px_rgba(59,130,246,0.4)]"></div></div>
                    </div>
                    <span id="val-roll" class="mt-2 font-mono text-blue-400 font-bold">0°</span>
                </div>
            </div>
            <div class="bg-slate-900 p-4 rounded-lg flex flex-col items-center border border-slate-700 shadow-inner">
                <span class="text-sm font-bold text-slate-400 mb-2">COMPASS</span>
                <div class="h-24 w-24 rounded-full border-4 border-slate-700 flex justify-center items-center relative bg-slate-800"><div id="compass-needle" class="w-1.5 h-20 bg-red-500 absolute transition-transform duration-200 shadow-lg" style="clip-path: polygon(50% 0%, 0% 100%, 100% 100%);"></div></div>
                <span id="val-compass" class="mt-2 font-mono text-red-400 font-bold">0° N</span>
            </div>
        </div>
        
        <!-- Telemetry & Controls Column -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 flex flex-col gap-4 flex-1 h-full min-h-0">
            <h2 class="text-xl font-bold text-slate-300">Telemetry & Controls</h2>
            <div class="flex flex-col gap-3 flex-1 min-h-[250px]">
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 flex-1 shadow-inner flex items-center min-h-[60px]">
                    <span class="text-[10px] sm:text-xs font-bold text-orange-400 w-12 text-center">TEMP</span><div class="flex-1 h-full w-full relative"><canvas id="chart-temp"></canvas></div>
                </div>
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 flex-1 shadow-inner flex items-center min-h-[60px]">
                    <span class="text-[10px] sm:text-xs font-bold text-yellow-400 w-12 text-center">LIGHT</span><div class="flex-1 h-full w-full relative"><canvas id="chart-light"></canvas></div>
                </div>
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 flex-1 shadow-inner flex items-center min-h-[60px]">
                    <span class="text-[10px] sm:text-xs font-bold text-cyan-400 w-12 text-center">SOUND</span><div class="flex-1 h-full w-full relative"><canvas id="chart-sound"></canvas></div>
                </div>
            </div>
            <div class="flex flex-col gap-3 mt-4 shrink-0">
                <div class="flex gap-2">
                    <input type="text" id="cmd-txt" placeholder="Type message..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 font-mono text-white">
                    <button onclick="sendBluetoothCommand('TXT:' + document.getElementById('cmd-txt').value)" class="bg-blue-600 hover:bg-blue-500 px-4 rounded-lg font-bold text-sm transition-colors shadow-lg">SEND</button>
                </div>
                <div class="flex gap-2">
                    <select id="cmd-ico" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none font-mono text-white">
                        <option value="Heart">❤️ Heart</option>
                        <option value="Happy">😀 Happy</option>
                        <option value="Ghost">ghost Ghost</option>
                    </select>
                    <button onclick="sendBluetoothCommand('ICO:' + document.getElementById('cmd-ico').value)" class="bg-pink-600 hover:bg-pink-500 px-4 rounded-lg font-bold text-sm transition-colors shadow-lg">SHOW</button>
                </div>
                <div class="flex gap-2">
                    <select id="cmd-snd" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none font-mono text-white">
                        <option value="BaDing">BaDing</option>
                        <option value="PowerUp">PowerUp</option>
                        <option value="Wawawawa">Wawawawa</option>
                    </select>
                    <button onclick="sendBluetoothCommand('SND:' + document.getElementById('cmd-snd').value)" class="bg-teal-600 hover:bg-teal-500 px-4 rounded-lg font-bold text-sm transition-colors shadow-lg">PLAY</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isSimActive = false, simInterval = null;
        let isCloudActive = false, cloudRoomId = null, cloudInterval = null;
        let isEditMode = false;

        let bluetoothDevice, bluetoothServer, uartService, rxCharacteristic, txCharacteristic;
        const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_RX_CHAR_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_TX_CHAR_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
        let rxBuffer = '';

        window.onload = () => {
            initLEDs();
            initCharts();
        };

        function showMsg(msg) {
            const box = document.getElementById('msg-box');
            box.innerText = msg;
            box.classList.remove('opacity-0', 'pointer-events-none'); box.classList.add('opacity-100');
            setTimeout(() => { box.classList.remove('opacity-100'); box.classList.add('opacity-0', 'pointer-events-none'); }, 4000);
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('btn-edit');
            if (isEditMode) {
                document.body.classList.add('is-editing');
                btn.innerHTML = "🔓 Editing UI";
                btn.className = "bg-yellow-500 hover:bg-yellow-400 text-yellow-950 font-bold py-2 px-4 rounded-lg transition-colors min-w-[140px] shadow-[0_0_15px_rgba(234,179,8,0.4)]";
                document.querySelectorAll('.ui-editable').forEach(el => el.removeAttribute('readonly'));
            } else {
                document.body.classList.remove('is-editing');
                btn.innerHTML = "🔒 Lock UI";
                btn.className = "bg-slate-600 hover:bg-slate-500 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[140px] shadow-lg";
                document.querySelectorAll('.ui-editable').forEach(el => el.setAttribute('readonly', true));
            }
        }

        function initLEDs() {
            const matrix = document.getElementById('led-matrix');
            for(let i=0; i<25; i++) {
                const led = document.createElement('div');
                led.className = 'led'; led.dataset.idx = i;
                led.onclick = () => { led.classList.toggle('active'); let x = i % 5; let y = Math.floor(i / 5); let state = led.classList.contains('active') ? 1 : 0; sendBluetoothCommand(`LED:${x},${y},${state}`); };
                matrix.appendChild(led);
            }
        }

        let chartTemp, chartLight, chartSound;
        function initCharts() {
            Chart.defaults.color = '#94a3b8';
            const createConfig = (color, maxVal) => ({
                type: 'line', data: { labels: [], datasets: [{ borderColor: color, data: [], tension: 0.4, pointRadius: 0, borderWidth: 2 }] },
                options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { min: 0, max: maxVal, border: {display: false}, ticks: { maxTicksLimit: 3 }, grid: {color: '#334155', drawBorder: false} } } }
            });
            chartTemp = new Chart(document.getElementById('chart-temp').getContext('2d'), createConfig('#fb923c', 50));
            chartLight = new Chart(document.getElementById('chart-light').getContext('2d'), createConfig('#facc15', 255));
            chartSound = new Chart(document.getElementById('chart-sound').getContext('2d'), createConfig('#22d3ee', 255));
        }

        function pushMainChart(chart, val) {
            chart.data.labels.push(''); chart.data.datasets[0].data.push(val);
            if(chart.data.labels.length > 20) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
            chart.update();
        }

        async function connectBluetooth() {
            if(isSimActive) { showMsg("Please turn off Sim Mode before connecting to real hardware."); return; }
            if (!navigator || !navigator.bluetooth) { showMsg("Web Bluetooth API is missing! Make sure you are using Chrome or Edge, and serving via HTTPS."); return; }
            
            try {
                bluetoothDevice = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'BBC micro:bit' }], optionalServices: [UART_SERVICE_UUID] });
                bluetoothServer = await bluetoothDevice.gatt.connect();
                uartService = await bluetoothServer.getPrimaryService(UART_SERVICE_UUID);
                txCharacteristic = await uartService.getCharacteristic(UART_TX_CHAR_UUID);
                rxCharacteristic = await uartService.getCharacteristic(UART_RX_CHAR_UUID);

                await rxCharacteristic.startNotifications();
                rxCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

                const btn = document.getElementById("btnConnect");
                btn.innerHTML = "✅ Connected"; btn.classList.replace("bg-blue-600", "bg-green-600"); btn.classList.replace("hover:bg-blue-500", "hover:bg-green-500");

                bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                    const btn = document.getElementById("btnConnect");
                    btn.innerHTML = "🔌 Connect"; btn.classList.replace("bg-green-600", "bg-blue-600"); btn.classList.replace("hover:bg-green-500", "hover:bg-blue-500");
                    showMsg("Micro:bit disconnected!");
                });
            } catch (error) { showMsg("Connection failed or cancelled. Check console (F12) for details."); }
        }

        function handleIncomingData(event) {
            let value = new TextDecoder().decode(event.target.value);
            rxBuffer += value;
            let lines = rxBuffer.split('\n');
            if(lines.length > 1) { parseTelemetry(lines[0].trim()); rxBuffer = lines.slice(1).join('\n'); }
        }

        function parseTelemetry(str) {
            const pairs = str.split(',');
            const data = {};
            pairs.forEach(p => {
                let kv = p.split(':');
                if(kv.length === 2) {
                    if(kv[0] === 'leds') { data[kv[0]] = kv[1]; } else { data[kv[0]] = parseFloat(kv[1]); }
                }
            });

            if(data.leds !== undefined && typeof data.leds === 'string' && data.leds.length === 25) {
                const matrixLeds = document.querySelectorAll('#led-matrix .led');
                for(let i=0; i<25; i++) {
                    if(data.leds[i] === '1') matrixLeds[i].classList.add('active'); else matrixLeds[i].classList.remove('active');
                }
            }

            if(data.temp !== undefined) pushMainChart(chartTemp, data.temp);
            if(data.light !== undefined) pushMainChart(chartLight, data.light);
            if(data.sound !== undefined) pushMainChart(chartSound, data.sound);
            if(data.pitch !== undefined) { document.getElementById('val-pitch').innerText = `${Math.round(data.pitch)}°`; document.getElementById('pitch-bar').style.transform = `translateY(${Math.max(-48, Math.min(48, data.pitch))}px)`; }
            if(data.roll !== undefined) { document.getElementById('val-roll').innerText = `${Math.round(data.roll)}°`; document.getElementById('roll-horizon').style.transform = `rotate(${data.roll}deg)`; }
            if(data.head !== undefined) { document.getElementById('val-compass').innerText = `${Math.round(data.head)}° N`; document.getElementById('compass-needle').style.transform = `rotate(${data.head}deg)`; }
            
            if(data.btnA !== undefined) { const btn = document.getElementById('twin-btnA'); if(data.btnA === 1) btn.classList.add('btn-press'); else btn.classList.remove('btn-press'); }
            if(data.btnB !== undefined) { const btn = document.getElementById('twin-btnB'); if(data.btnB === 1) btn.classList.add('btn-press'); else btn.classList.remove('btn-press'); }

            if(data.shk === 1) {
                const shakeInd = document.getElementById('shake-indicator'); const logo = document.getElementById('twin-logo');
                logo.classList.add('bg-red-500', 'border-red-600', 'translate-y-1'); logo.classList.remove('bg-slate-800', 'border-yellow-600');
                shakeInd.innerText = "SHAKE DETECTED"; shakeInd.className = "bg-red-600 text-white text-center py-2 rounded-lg font-bold uppercase transition-colors shadow-[0_0_10px_rgba(220,38,38,0.5)] border border-red-500";
                setTimeout(() => {
                    logo.classList.remove('bg-red-500', 'border-red-600', 'translate-y-1'); logo.classList.add('bg-slate-800', 'border-yellow-600');
                    shakeInd.innerText = "No Shake"; shakeInd.className = "bg-slate-700 text-slate-400 text-center py-2 rounded-lg font-bold uppercase transition-colors border border-slate-600";
                }, 800);
            }
        }

        async function sendBluetoothCommand(cmd) {
            if (!txCharacteristic) { console.log(`[Simulated TX] ${cmd}`); return; }
            try {
                let encoder = new TextEncoder(); let data = encoder.encode(cmd + '\n');
                if (txCharacteristic.properties.writeWithoutResponse) { await txCharacteristic.writeValueWithoutResponse(data); } 
                else { await txCharacteristic.writeValue(data); }
            } catch (err) { console.error("TX Error:", err); }
        }

        function toggleCloud() {
            isCloudActive = !isCloudActive; const btn = document.getElementById('btn-cloud');
            if (isCloudActive) {
                cloudRoomId = Math.floor(1000 + Math.random() * 9000);
                btn.innerHTML = `🔴 Live: Room ${cloudRoomId}`; btn.className = "bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[140px] animate-pulse shadow-[0_0_15px_rgba(220,38,38,0.5)]";
                cloudInterval = setInterval(syncCloud, 2000);
            } else {
                btn.innerHTML = `☁️ Go Public`; btn.className = "bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[140px] shadow-lg";
                clearInterval(cloudInterval);
            }
        }

        function syncCloud() {
            console.log(`Syncing basic data to room ${cloudRoomId}...`);
        }

        let tick = 0;
        function toggleSim() {
            isSimActive = !isSimActive; const btn = document.getElementById('btn-sim');
            if (isSimActive) {
                if(bluetoothDevice && bluetoothDevice.gatt.connected) { bluetoothDevice.gatt.disconnect(); }
                btn.className = "bg-green-400 text-green-950 font-bold py-2 px-4 rounded-lg transition-colors border-2 border-green-300 shadow-[0_0_15px_rgba(74,222,128,0.5)] min-w-[130px]";
                btn.innerText = "🛑 Stop Sim"; simInterval = setInterval(runSim, 1000);
            } else {
                btn.className = "bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[130px] shadow-lg";
                btn.innerText = "🧪 Sim Mode"; clearInterval(simInterval);
            }
        }

        function runSim() {
            tick += 0.5;
            let simLeds = ""; for(let i=0; i<25; i++) simLeds += Math.random() > 0.8 ? "1" : "0";
            parseTelemetry(`temp:${Math.round(25 + Math.sin(tick)*5)}`);
            parseTelemetry(`light:${Math.round(128 + Math.cos(tick*2)*100)}`);
            parseTelemetry(`sound:${Math.round(Math.random() * 50)}`);
            parseTelemetry(`pitch:${Math.round(Math.sin(tick) * 45)},roll:${Math.round(Math.cos(tick * 0.8) * 90)},head:${Math.round((tick * 50) % 360)}`);
            parseTelemetry(`btnA:0,btnB:0,shk:0,leds:${simLeds}`);
        }
    </script>
</body>
</html>
